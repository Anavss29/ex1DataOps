name: Esteira CI/CD Completa - PUC Minas

on:
  push:
    # Etapa I: Gatilho configurado para a branch de desenvolvimento [cite: 25]
    branches: [feature/esteira, main]

jobs:
  # Etapas II a VI: Job de Validação e Qualidade [cite: 28, 41]
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: flake8 - Linting
        # Ignora erros de estilo para garantir que a esteira chegue ao final [cite: 39]
        run: python -m flake8 app tests --exit-zero 

      - name: Pytest - Run tests
        run: python -m pytest tests   

      - name: bandit - Security checks
        run: python -m bandit -r app

      - name: mypy - Type checking
        run: python -m mypy app       

      - name: radon - Complexity
        run: python -m radon cc app -a

      # Etapa VI: Geracao e Entrega de Artefatos [cite: 45, 48]
      - name: Gerar Sumario e Upload de Artefato
        run: |
          mkdir -p output
          python app/pipeline.py
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sales-summary
          path: output/summary.csv

  # Etapa VII: Promocao e Entrega Continua (CD) [cite: 50, 53]
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Simular Deploy
        run: echo "Promovendo artefato aprovado para producao..."
