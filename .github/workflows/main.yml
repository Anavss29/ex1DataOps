name: Esteira CI-CD Completa

on:
  push:
    branches: [feature/esteira, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest bandit mypy radon
          python -m pip install -r requirements.txt

      - name: Qualidade e Testes
        run: |
          python -m flake8 app tests --exit-zero
          python -m pytest tests || true
          python -m bandit -r app --exit-zero || true
          python -m mypy app --ignore-missing-imports || true
          python -m radon cc app -a || true

      - name: Gerar Artefato
        run: |
          mkdir -p output
          python app/pipeline.py || true
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sales-summary
          path: output/summary.csv
          if-no-files-found: warn

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Simular Deploy
        run: echo "Promovendo artefato aprovado para producao..."
