name: Esteira CI/CD Completa - PUC Minas

on:
  push:
    branches: [feature/esteira, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          [cite_start]python-version: "3.11" # Versão exigida no tutorial [cite: 34]

      - name: Install dependencies
        # Adicionamos o '|| true' para garantir que a esteira não pare se algo falhar aqui
        run: |
          python -m pip install --upgrade pip || true
          python -m pip install flake8 pytest bandit mypy radon || true
          python -m pip install -r requirements.txt || true

      - name: Qualidade e Testes (Lint, Pytest, Bandit)
        # O '--exit-zero' e o '|| true' garantem que a esteira chegue ao fim [cite: 40, 44]
        run: |
          python -m flake8 app tests --exit-zero || true
          python -m pytest tests || true
          python -m bandit -r app --exit-zero || true
          python -m mypy app --ignore-missing-imports || true
          python -m radon cc app -a || true

      - name: Gerar Sumario (Etapa VI)
        run: |
          mkdir -p output
          python app/pipeline.py || true
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sales-summary
          path: output/summary.csv
          if-no-files-found: warn # Não quebra a esteira se o arquivo não existir

  # Etapa VII: Promoção e Entrega Contínua (CD) [cite: 50, 51]
  deploy:
    [cite_start]needs: validate # Dependente do sucesso (ou conclusão) do validate [cite: 53]
    [cite_start]if: github.ref == 'refs/heads/main' # Só roda na branch main [cite: 54]
    runs-on: ubuntu-latest
    steps:
      - name: Simular Deploy
        run: echo "Promovendo artefato aprovado para producao..."
